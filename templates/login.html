<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | ProDevice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='diseño.css') }}">
  <style>
    .auth-wrapper {
      max-width: 420px;
      margin: 4rem auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .auth-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .auth-subtitle { color: #64748b; font-size: 0.88rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; }
    .form-group input {
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus { border-color: #2563eb; }
    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body style="background-color: #f8fafc;">
  <div class="auth-wrapper">
    <h1 class="auth-title">Iniciar Sesión</h1>
    <p class="auth-subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert-error">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="correo@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="buy-btn" style="margin-top: 1rem;">Entrar al sistema</button>
      <a href="/" style="display: block; text-align: center; margin-top: 1.2rem; color: #64748b; text-decoration: none; font-size: 0.85rem;">← Volver al catálogo</a>
    </form>
  </div>
</body>
</html>
