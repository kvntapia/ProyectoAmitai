<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Dispositivo | ProDevice Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='diseño.css') }}">
  <style>
    .admin-form-container {
      max-width: 580px;
      margin: 3rem auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }
    .form-group label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #0f172a;
    }
    .form-group input, .form-group select {
      padding: 0.75rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s ease;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .helper-text {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body style="background-color: #f8fafc;">

  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span class="material-symbols-outlined logo-icon">smartphone</span>
        <span class="brand-name">Pro<span>Device</span></span>
      </a>
      <a href="/" class="action-btn" style="text-decoration: none;">← Volver al catálogo</a>
    </div>
  </header>

  <main class="main-content">
    <div class="admin-form-container">
      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem;">Registrar Nuevo Dispositivo</h1>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.75rem;">Agrega un nuevo modelo al catálogo oficial de ProDevice.</p>

      <form method="POST" action="/admin/agregar-producto">
        <div class="form-group">
          <label for="marca">Marca del Dispositivo</label>
          <select name="marca" id="marca" required>
            <option value="" disabled selected>Selecciona una marca...</option>
            <option value="Apple">Apple</option>
            <option value="Samsung">Samsung</option>
            <option value="Xiaomi">Xiaomi</option>
            <option value="Motorola">Motorola</option>
          </select>
        </div>

        <div class="form-group">
          <label for="modelo">Nombre del Modelo</label>
          <input type="text" name="modelo" id="modelo" placeholder="Ej. iPhone 17 Pro Max 256GB" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="precio">Precio de Venta ($ MXN)</label>
          <input type="number" step="0.01" name="precio" id="precio" placeholder="28999.00" required>
        </div>

        <div class="form-group">
          <label for="imagen_url">URL de Imagen (Opcional)</label>
          <input type="url" name="imagen_url" id="imagen_url" placeholder="https://ejemplo.com/foto.jpg">
          <span class="helper-text">Si dejas este campo en blanco, se asignará automáticamente la imagen genérica de la marca.</span>
        </div>

        <button type="submit" class="buy-btn" style="margin-top: 1rem; width: 100%;">
          <span class="material-symbols-outlined">save</span>
          Publicar Dispositivo en la Tienda
        </button>
      </form>
    </div>
  </main>

</body>
</html>
